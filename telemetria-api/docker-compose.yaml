version: '3.8'
services:
  db-biometrics:
    image: postgres:15-alpine
    container_name: biometrics_postgres
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Definir DB_PASSWORD (ver .env.example)}
      POSTGRES_DB: biometrics_db
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: