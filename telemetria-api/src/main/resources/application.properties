# ===================================================================
# IMPORTA SECRETOS LOCALES (archivo NO versionado, ver .gitignore)
# Sin este archivo, la app falla al arrancar en vez de usar un secreto por defecto conocido.
# ===================================================================
spring.config.import=optional:classpath:application-local.properties

# ===================================================================
# PUERTO HTTP
# ===================================================================
# Render (y otros PaaS) inyectan el puerto a escuchar en la variable PORT; en local y con
# docker-compose esa variable no existe y se usa 8080.
server.port=${PORT:8080}

# ===================================================================
# CONFIGURACIÓN DE LA BASE DE DATOS (PostgreSQL en Docker)
# ===================================================================
spring.datasource.url=jdbc:postgresql://localhost:5434/biometrics_db
spring.datasource.username=admin
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===================================================================
# CONFIGURACIÓN DE JPA / HIBERNATE
# ===================================================================
# 'update' creará las tablas automáticamente en PostgreSQL basándose en tus clases de Java
spring.jpa.hibernate.ddl-auto=update

# Muestra en la consola las consultas SQL que Spring Boot genera en tiempo real (útil para la escuela)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Forzar el dialecto moderno de PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ===================================================================
# CONFIGURACIÓN DEL POOL DE CONEXIONES (HikariCP)
# ===================================================================
# Optimización para soportar la carga paralela del Watch y la Web
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.connection-timeout=30000

# ===================================================================
# CONFIGURACIÓN DE SEGURIDAD / JWT
# ===================================================================
# Secreto HMAC-SHA256, minimo 32 caracteres (256 bits). Viene de application-local.properties (dev) o de la
# variable de entorno JWT_SECRET (otros entornos). Nunca se define un valor por defecto aqui.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=3600000

# ===================================================================
# CORS / ORIGEN PERMITIDO (una sola fuente de verdad para HTTP y WebSocket)
# ===================================================================
app.cors.allowed-origin=http://localhost:4200

# ===================================================================
# COOKIE DE SESION (JWT httpOnly)
# ===================================================================
# false en dev (http://localhost); poner true en cualquier despliegue real detras de HTTPS.
app.cookie.secure=false

# ===================================================================
# CONFIGURACIÓN DE BLOQUEO POR FUERZA BRUTA
# ===================================================================
app.security.lockout.max-attempts=5
app.security.lockout.duration-minutes=15

# Rate limiting por IP en /api/auth/login y /login-pin (independiente del bloqueo por cuenta de arriba;
# cubre el caso de fuerza bruta probando muchos usernames distintos desde la misma IP).
app.security.rate-limit.max-attempts=20
app.security.rate-limit.window-seconds=60

# ===================================================================
# USUARIO ADMIN SEMBRADO AUTOMATICAMENTE AL ARRANCAR (si no existe ningun ADMIN)
# El username no es secreto (default razonable); el password SIEMPRE viene de application-local.properties
# o de la variable de entorno ADMIN_PASSWORD.
# ===================================================================
app.admin.default-username=${ADMIN_USERNAME:admin}
app.admin.default-password=${ADMIN_PASSWORD}

# ===================================================================
# ACTUATOR (monitoreo)
# ===================================================================
# Lista blanca explicita: solo health e info quedan expuestos por HTTP. El resto de endpoints
# (env, beans, heapdump, ...) filtrarian configuracion interna y siguen apagados.
management.endpoints.web.exposure.include=health,info
management.info.build.enabled=true
# 'never' es el default, pero se deja explicito: el detalle del health (URL de la base, estado del
# pool) no debe llegar a un cliente anonimo, ya que /actuator/health es publico.
management.endpoint.health.show-details=never

# ===================================================================
# OPENAPI / SWAGGER UI
# ===================================================================
springdoc.swagger-ui.path=/swagger-ui.html