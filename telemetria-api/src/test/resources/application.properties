# ===================================================================
# CONFIGURACION EXCLUSIVA DE TESTS
# Reemplaza por completo a src/main/resources/application.properties (los tests cargan primero
# el classpath de test). Es autocontenida a proposito: asi `mvnw test` corre en CI y en una clonada
# limpia sin PostgreSQL, sin application-local.properties y sin variables de entorno.
# ===================================================================

# Base en memoria: cada corrida arranca con el esquema recien creado y no deja rastro.
spring.datasource.url=jdbc:h2:mem:telemetria-test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
# 'timestamp' (telemetry_records) es palabra reservada en H2; sin esto el DDL de arranque falla.
spring.jpa.properties.hibernate.auto_quote_keyword=true
spring.jpa.show-sql=false

# Valores de prueba, no secretos: esta base se destruye al terminar la corrida.
# El secreto JWT solo necesita superar los 32 caracteres (256 bits) que exige HMAC-SHA256.
app.jwt.secret=test-secret-solo-para-tests-de-junit-32bytes
app.jwt.expiration-ms=3600000

app.cors.allowed-origin=http://localhost:4200
app.cookie.secure=false

app.security.lockout.max-attempts=5
app.security.lockout.duration-minutes=15
app.security.rate-limit.max-attempts=20
app.security.rate-limit.window-seconds=60

app.admin.default-username=admin
app.admin.default-password=test-admin-password

# Espeja la configuracion de actuator de produccion: este archivo sustituye por completo al
# application.properties principal, asi que sin estas lineas los tests probarian una exposicion
# distinta de la real (por defecto solo 'health').
management.endpoints.web.exposure.include=health,info
management.info.build.enabled=true
management.endpoint.health.show-details=never
